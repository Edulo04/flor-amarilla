<!DOCTYPE html>
<html lang="es">

<head>

        <section id="inicio" class="pantalla mensaje-inicial">

        <!-- RAMITO -->

                    </div>

                    <div class="centro-flor"></div>

                </div>


                <!-- Girasol central -->

                <div class="girasol flor-centro">

                    <div class="petalos">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                        <span></span>

                    </div>

                    <div class="centro-flor"></div>

                </div>


                <!-- Girasol derecho -->

                <div class="girasol flor-derecha">

                    <div class="petalos">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="centro-flor"></div>

                </div>

            </div>


            <!-- TALLOS -->

            <div class="tallo tallo-izquierdo"></div>

            <div class="tallo tallo-centro"></div>

            <div class="tallo tallo-derecho"></div>


            <!-- HOJAS -->

            <div class="hoja hoja-izquierda"></div>

            <div class="hoja hoja-centro"></div>

            <div class="hoja hoja-derecha"></div>


            <!-- ENVOLTORIO -->

            <div class="envoltorio"></div>

            <div class="cinta"></div>

        </section>


        <!-- MENSAJE FINAL -->

        <section id="final" class="mensaje-final">

            <h2>Para vos 💛</h2>

            <p>Espero que te saque una sonrisa.</p>

    <script src="script.js"></script>

</html>
